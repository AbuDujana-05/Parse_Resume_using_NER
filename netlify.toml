[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API proxy -> Netlify function (force so it wins over the SPA fallback below)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback. NO force here: real files (dist/index.html, /assets/*.js,
# /assets/*.css, /proof/*) must be served directly, only unknown paths
# get rewritten to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
